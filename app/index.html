<script>
  // Одна ссылка на оба магазина: телефон сразу уходит в свой магазин,
  // на компьютере остаётся страница с двумя кнопками.
  (function () {
    var play = 'https://play.google.com/store/apps/details?id=com.anatret.jobboxv3';
    var apple = 'https://apps.apple.com/app/id6826568517';
    var ua = navigator.userAgent || '';
    // iPadOS представляется Mac'ом — отличаем по сенсорному экрану.
    var ios = /iPhone|iPad|iPod/i.test(ua) ||
      (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    if (ios) location.replace(apple);
    else if (android) location.replace(play);
  })();
</script>
